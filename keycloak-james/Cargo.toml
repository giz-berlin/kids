[package]
name = "keycloak-james"
description = "Keycloak to Matrix (James) identity syncer — synchronizes users and groups from Keycloak to a Matrix homeserver via webhook endpoints"
homepage = "https://rechenknecht.net/giz/keycloak/kids/-/tree/main/keycloak-james"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
kids-lib = { path = "../kids-lib" }
source-keycloak-lib = { path = "../source-keycloak-lib" }
anyhow = "1"
serde = { version = "1.0.218", features = ["serde_derive"] }
tracing = "0.1"
async-trait = "0.1.88"
rand = "0.9.0"
reqwest = { version = "0.12.15", features = ["default-tls", "native-tls"] }
url = "2.5.4"
serde_json = "1.0.140"
http = "1.2.0"
urlencoding = "2.1.3"
