# For documentation on the configuration parameters, refer to the default_configs directory.
# This file does intentionally not contain any parameter comments, as those could get out of sync quite easily.

[controller.api]
mode = "enabled"
bind_addr = "0.0.0.0:4165"

[controller.api.tls]
mode = "insecure_disabled"

[sentry]
active = false
dsn = "https://2b259ab7638c4a71ab3fca497e2c5295@sentry.giz.berlin/22"
environment = "develop"

[source]
[source.keycloak_api]
keycloak_address = "https://host.docker.internal:8443"
client_id = "keycloak_identity_syncer"
client_secret = "keycloak_identity_syncer_secret"
realm = "giz"
fetch_service_accounts = false
insecure_disable_tls_verification = true

[target]
source_room_name_attr = "matrixRoomName"
room_deletion_strategy = "KickAll"
# Do not set it to disable this feature in e2e tests.
# required_role_name = "feature:authenticate"
[target.synapse_api]
matrix_homeserver_url = "https://host.docker.internal:8448"
matrix_source_oidc_provider_id = "oidc-keycloak"
matrix_syncer_user_id = "@admin:host.docker.internal:8448"
matrix_syncer_password = "password"
matrix_namespace = "host.docker.internal:8448"
insecure_disable_tls_verification = true
