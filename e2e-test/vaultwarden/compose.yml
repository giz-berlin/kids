services:
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE}
    container_name: ${VAULTWARDEN_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - DOMAIN=https://${PODMAN_SERVICE_HOSTNAME}:${VAULTWARDEN_TLS_PORT}
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - ORG_GROUPS_ENABLED=true
      - ROCKET_TLS={certs="/ssl/${VAULTWARDEN_CONTAINER_NAME}.crt",key="/ssl/${VAULTWARDEN_CONTAINER_NAME}.key"}
    # Required on SELinux systems to make mounts available to the container
    security_opt:
      - label:disable
    volumes:
      - ./vw_data/:/data/
      - ./certs/${VAULTWARDEN_CONTAINER_NAME}.crt:/ssl/${VAULTWARDEN_CONTAINER_NAME}.crt:ro
      - ./certs/${VAULTWARDEN_CONTAINER_NAME}.key:/ssl/${VAULTWARDEN_CONTAINER_NAME}.key:ro
    ports:
      - 127.0.0.1:${VAULTWARDEN_TLS_PORT}:80

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: ${KEYCLOAK_CONTAINER_NAME}
    restart: unless-stopped
    command: start --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=password
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
    # Required on SELinux systems to make mounts available to the container
    security_opt:
      - label:disable
    volumes:
      - ./config/keycloak_realm_giz.json:/opt/keycloak/data/import/keycloak_realm_giz.json
      - ../keycloak/keycloak-webhook-spi-2.0.1.jar:/opt/keycloak/providers/keycloak-webhook-spi-2.0.1.jar
      - ../keycloak/webhook-config.json:/opt/keycloak/conf/webhook-config.json
    ports:
      - 0.0.0.0:${KEYCLOAK_PORT}:8080
      - 127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT}:9000
