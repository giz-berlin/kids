[package]
name = "kids"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5.31", features = ["derive"] }
sentry = { version = "0.36", features = ["tracing"] }
serde = { version = "1.0.218", features = ["serde_derive"] }
toml = "0.8.20"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
async-trait = "0.1.88"
thiserror = "1.0.69"
rand = "0.9.0"
derive_builder = "0.20.2"
mockall = "0.13.1"
keycloak = "26.2.0"
reqwest = "0.12.15"
uuid = { version = "1.16.0", features = ["v4"] }

[[bin]]
name = "keycloak-james"

[[bin]]
name = "keycloak-synapse"
