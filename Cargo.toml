[package]
name = "kids"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5.31", features = ["derive"] }
sentry = { version = "0.43", features = ["tracing", "tower", "tower-http", "tower-axum-matched-path"] }
serde = { version = "1.0.218", features = ["serde_derive"] }
toml = "0.8.20"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
async-trait = "0.1.88"
thiserror = "1.0.69"
rand = "0.9.0"
derive_builder = "0.20.2"
mockall = "0.13.1"
keycloak = "~26.2.0"
reqwest = { version = "0.12.15", features = ["default-tls", "native-tls"] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }
url = "2.5.4"
serde_json = "1.0.140"
http = "1.2.0"
chrono = { version = "0.4.41", features = ["serde"] }
aide = { version = "0.15.1", features = [
  "axum",
  "axum-json",
  "axum-query",
  "redoc",
  "macros",
] }
axum = { version = "0.8.6", features = ["tracing", "macros"] }
indexmap = "2.11.4"
schemars = { version = "0.9.0", features = ["chrono04", "uuid1"] }
urlencoding = "2.1.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
axum-server = { version = "0.8", features = ["tls-rustls"] }
sha2 = "0.11"
tower-http = { version = "0.7", features = ["add-extension"] }

[[bin]]
name = "keycloak-james"

[[bin]]
name = "keycloak-synapse"

[[bin]]
name = "keycloak-memory"

[[bin]]
name = "webhook-cli"

[dev-dependencies]
rcgen = { version = "0.14.8", features = ["ring"] }
rstest = "0.25.0"

[profile.test.package."*"]
# To make recompiling tests a bit faster, see
# https://www.reddit.com/r/bevy/comments/1jtrcdy/unit_tests_recompile_all_dependencies_every_time/
# This problem only occurs since Rust 1.86.0
opt-level = 3
