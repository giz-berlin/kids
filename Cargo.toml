[package]
name = "kids"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5.31", features = ["derive"] }
sentry = { version = "0.36", features = ["tracing"] }
serde = { version = "1.0.218", features = ["serde_derive"] }
toml = "0.8.20"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
async-trait = "0.1.88"
thiserror = "1.0.69"
rand = "0.9.0"
derive_builder = "0.20.2"
mockall = "0.13.1"
keycloak = "26.2.0"
reqwest = { version = "0.12.15", features = ["default-tls"] }
uuid = { version = "1.16.0", features = ["v4"] }
url = "2.5.4"
serde_json = "1.0.140"
http = "1.2.0"
chrono = "0.4.41"

[[bin]]
name = "keycloak-james"

[[bin]]
name = "keycloak-synapse"

[dev-dependencies]
rstest = "0.25.0"

[profile.test.package."*"]
# To make recompiling tests a bit faster, see
# https://www.reddit.com/r/bevy/comments/1jtrcdy/unit_tests_recompile_all_dependencies_every_time/
# This problem only occurs since Rust 1.86.0
opt-level = 3
