[target]
# Only source groups that have an attribute with this name set will be synced as rooms to
# Matrix.
source_room_name_attr = "matrixRoomName"
# How should the syncer react to rooms that are deleted in the source?
# Note that this not only happens when the corresponding group is deleted in the source,
# but also when a group no longer has an attribute named like the value of
# `source_room_name_attr` (see above).
# possible values:
#    Ignore:
#        Do not modify the Matrix room. No users will be removed from it
#        and no attributes (name, alias, power levels) will be updated.
#    KickAll:
#        Kick all users except the sync user from the room. The room will continue to exist and
#        users may be added again later. Depending on the Matrix homeserver configuration, users
#        might access messages again if they could read/decrypt them before they were kicked.
#    Evacuate:
#        Like KickAll, but the sync user also leaves the room.
#        With no members left, it is **impossible to re-add members**, the room is "bricked".
#        Synapse will shut down the room after some time and might delete messages from the database.
#    Delete:
#        The most effective and dangerous option. The room is completely deleted and all traces of
#        it are removed from the database immediately.
room_deletion_strategy = "Evacuate"
# A role that must be present on the source user for it to be considered in Synapse.
# Optional
required_role_name = "feature:authenticate"
# A role that, if present on a source user, makes that user able to start admin sessions.
# Optional
# If not present, admin status of users will not be managed by KIDS.
admin_role_name = "feature:admin"

[target.synapse_api]
# URL of the Matrix homeserver (probably similar to https://matrix.example.com).
matrix_homeserver_url = "https://localhost"
# URL of the Matrix Authentication Service API (probably similar to https://matrix.example.com/auth).
matrix_mas_url = "https://localhost"
# The ULID of the source as an identity provider in the MAS config as `client_id` key in `clients`
# (https://element-hq.github.io/matrix-authentication-service/reference/configuration.html#clients).
# In order to map Matrix users to source users, the syncer needs to know how MAS identifies the source.
matrix_source_oidc_provider_ulid = "keycloak"
# User ID of a Matrix user that must have administrative access.
# This user will perform all operations required for syncing users and rooms.
# Create a dedicated user if you can.
matrix_syncer_user_id = "@example-syncer:localhost"
# Whether to validate the server certificate of the Matrix homeserver.
# Only disable for local development purposes!
insecure_disable_tls_verification = false
# LEGACY: Needed for getting account data events used by old matrix syncer.
# Only needed while migrating from old syncer, should be removed afterward.
matrix_namespace = "localhost"
[target.synapse_api.api_access]
# The ULID of the MAS client used by KIDS, in the MAS config as `client_id` key in `clients`.
# It must be part of the `admin_clients` policy for KIDS to function.
mas_client_id = ""
# The client secret for the `mas_client_id`.
mas_client_secret = ""
# How long tokens used for accessing the Synapse & Matrix C-S API are valid, in seconds.
token_validity_seconds = 120
