[package]
name = "kids-lib"
description = "Core library for Keycloak Identity Syncer — provides the sync engine framework with CLI infrastructure, configuration parsing, source/target interfaces, and controller logic for syncing identity data between services"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aide = { version = "0.15.1", features = [
    "axum",
    "axum-json",
    "axum-query",
    "redoc",
    "macros",
] }
anyhow = "1"
async-trait = "0.1.88"
axum = { version = "0.8.6", features = ["tracing", "macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
clap = { version = "4.5.31", features = ["derive"] }
http = "1.2.0"
indexmap = "2.11.4"
rand = "0.9.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
schemars = { version = "0.9.0", features = ["chrono04", "uuid1"] }
sentry = { version = "0.43", features = ["tracing", "tower", "tower-http", "tower-axum-matched-path"] }
serde = { version = "1.0.218", features = ["serde_derive"] }
serde_json = "1.0.140"
sha2 = "0.11"
thiserror = "1.0.69"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = "0.8.20"
tower-http = { version = "0.7", features = ["add-extension"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }

[dev-dependencies]
rcgen = { version = "0.14.8", features = ["ring"] }

[lints]
workspace = true
