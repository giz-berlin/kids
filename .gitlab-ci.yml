image: dr.rechenknecht.net/bauhelfer/container/main/rust:ubuntu-jammy

stages:
  - build
  - test
  - build-container
  - test-e2e

variables:
  # This will instruct Docker not to start over TLS.
  DOCKER_TLS_CERTDIR: ""
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

cache:
  # Cache per branch
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - target
    - ${CI_PROJECT_DIR}/.cargo

############
# Building
############

build-release:
  stage: build
  script:
    - cargo build --release --verbose
  artifacts:
    paths:
      - target/release/keycloak-memory
      - target/release/keycloak-synapse
      - target/release/keycloak-james
      - target/release/webhook-cli
    expire_in: 1 week
    when: always

build-debug:
  stage: build
  script:
    - cargo build --verbose
  artifacts:
    paths:
      - target/debug/keycloak-memory
      - target/debug/keycloak-synapse
      - target/debug/keycloak-james
      - target/debug/webhook-cli
    expire_in: 2 days
    when: always

############
# Testing
############

lint:
  stage: test
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -Dwarnings
  needs:
    - build-debug

fmt-check:
  stage: test
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check
  needs:
    - build-debug

test-debug:
  stage: test
  script:
    - cargo llvm-cov --html --all-features
    - cargo llvm-cov report --cobertura --output-path target/llvm-cov/cobertura.xml
    - "xmllint --xpath \"concat('Coverage: ', 100 * string(//coverage/@line-rate), '%')\" target/llvm-cov/cobertura.xml"
  coverage: '/Coverage: \d+(?:\.\d+)?/'
  artifacts:
    paths:
      - target/llvm-cov/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: target/llvm-cov/cobertura.xml
  needs:
    - build-debug

############
# Build Container
############

.docker-image-build: &docker-image-build
  stage: build-container
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/library/docker:latest
  needs:
    - job: build-release
      artifacts: true
  tags:
    # Use a privileged runner for building Docker containers.
    - privileged
  services:
    - name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/library/docker:dind
      alias: docker
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG/$TARGET_BINARY
    # This will instruct Docker not to start over TLS.
    DOCKER_TLS_CERTDIR: ""
  script:
    - export COMMIT_COUNT=`git rev-list --count HEAD`
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --build-arg "BINARY=${TARGET_BINARY}" -t "${IMAGE_NAME}:latest" -t "${IMAGE_NAME}:${COMMIT_COUNT}-${CI_PIPELINE_IID}" --push .

kids-james-container:
  extends: .docker-image-build
  variables:
    TARGET_BINARY: keycloak-james

kids-synapse-container:
  extends: .docker-image-build
  variables:
    TARGET_BINARY: keycloak-synapse

############
# E2E Testing
############

test-synapse-e2e:
  stage: test-e2e
  image: quay.io/podman/stable:latest
  needs:
    - job: kids-synapse-container
  tags:
    # Use a privileged runner for running (Docker) containers.
    - privileged
  script:
    - echo "Install dependencies"
    - dnf install unzip envsubst openssl jq --assumeyes --refresh
    - python -m ensurepip --upgrade
    - python -m pip install pyyaml
    - python -m pip install synadm
    - echo "$CI_REGISTRY_PASSWORD" | podman login --username $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - echo "127.0.0.1 host.docker.internal" >> /etc/hosts
    - pushd e2e-test
    - source .env
    - echo "Download Keycloak Webhook SPI"
    - pushd keycloak
    - >
      curl --output artifacts.zip --header "PRIVATE-TOKEN: $KEYCLOAK_WEBHOOK_SPI_DOWNLOAD"
      "https://rechenknecht.net/api/v4/projects/192/jobs/artifacts/main/download?job=build-jar"
    - unzip artifacts.zip
    - rm artifacts.zip
    - mv build/libs/* .
    - rmdir -p build/libs
    - popd
    - echo "Start Synapse & Keycloak"
    - ./setup_synapse_e2e.sh
    - echo "Start KIDS"
    - KIDS_PODMAN_ID=$(podman run -d -v $(realpath config/synapse_e2e_config.toml):/config.toml --net host $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG/keycloak-synapse:latest --config /config.toml)
    - echo "Waiting for KIDS to sync..."
    - sleep 10
    - podman logs $KIDS_PODMAN_ID
    - PODMAN_SERVICE_HOSTNAME=$PODMAN_SERVICE_HOSTNAME SYNAPSE_TLS_PORT=$SYNAPSE_TLS_PORT ./verify_synapse_e2e.sh
    - podman stop $KIDS_PODMAN_ID && podman rm $KIDS_PODMAN_ID
    - ./teardown_synapse_e2e.sh
