[package]
name = "keycloak-memory"
description = "In-memory target for Keycloak identity sync — provides a testable, no-dependency target implementation for local development and E2E testing without external services"
homepage = "https://rechenknecht.net/giz/keycloak/kids/-/tree/main/keycloak-memory"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
kids-lib = { path = "../kids-lib" }
source-keycloak-lib = { path = "../source-keycloak-lib" }
anyhow = "1"
serde = { version = "1.0.218", features = ["serde_derive"] }
tracing = "0.1"
async-trait = "0.1.88"
