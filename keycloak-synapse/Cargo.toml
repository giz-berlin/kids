[package]
name = "keycloak-synapse"
description = "Keycloak to Synapse identity syncer — synchronizes users and groups from Keycloak to a Synapse Matrix homeserver via webhook endpoints"
homepage = "https://rechenknecht.net/giz/keycloak/kids/-/tree/main/keycloak-synapse"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
kids-lib = { path = "../kids-lib" }
source-keycloak-lib = { path = "../source-keycloak-lib" }
anyhow = "1"
serde = { version = "1.0.218", features = ["serde_derive"] }
tracing = "0.1"
async-trait = "0.1.88"
reqwest = { version = "0.12.15", features = ["default-tls", "native-tls"] }
url = "2.5.4"
serde_json = "1.0.140"
http = "1.2.0"
chrono = { version = "0.4.41", features = ["serde"] }
urlencoding = "2.1.3"

[dev-dependencies]
kids-test-lib = { path = "../kids-test-lib" }
derive_builder = "0.20.2"
mockall = "0.13.1"
rstest = "0.25.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }
